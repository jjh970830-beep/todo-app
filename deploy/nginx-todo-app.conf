# Nginx 설정: 웹 화면 제공 + /api 요청을 API 서버로 전달
# 설치 위치: /etc/nginx/sites-available/todo-app  (sites-enabled 에 링크)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # npm run build 결과물을 복사해 둔 폴더
    root /var/www/todo-app;
    index index.html;

    # /api/ 로 시작하는 요청은 API 서버(3000번)로 전달
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 그 밖의 요청은 웹 파일, 없으면 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
