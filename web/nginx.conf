# 웹 컨테이너용 Nginx 설정: 웹 화면 제공 + /api 요청을 api 컨테이너로 전달
# (VM 에 직접 설치할 때 쓰는 설정은 deploy/nginx-todo-app.conf)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/ 로 시작하는 요청은 api 컨테이너(3000번)로 전달
    # "api" 는 docker-compose.yml 의 서비스 이름이고, Docker 가 컨테이너 주소로 바꿔 줍니다.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 그 밖의 요청은 웹 파일, 없으면 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
